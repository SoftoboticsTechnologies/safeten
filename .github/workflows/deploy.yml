name: Deploy static export to S3 + CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel token that triggered this deploy'
        required: false
        type: string
      envOverrides:
        description: 'JSON string of env var overrides for this deploy'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_BUCKET: ${{ vars.AWS_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      # NEXT_PUBLIC_* build-time vars (Vendure API URL/channel token, site
      # URL/name, Stripe publishable key) are NOT injected here — they come
      # from the committed .env.production (tracked in git, loaded
      # automatically by `next build`). See docs/decisions.md.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        # next.config.ts must have output: 'export' for this to emit an out/
        # directory (see docs/decisions.md, static-export migration entry) —
        # `next build` fails fast if that isn't set, so a misconfigured
        # branch never reaches the sync/invalidate steps below.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Sync static export to S3
        run: |
          aws s3 sync out "s3://${AWS_BUCKET}" --delete

      # - name: Invalidate CloudFront cache
      #   run: |
      #     aws cloudfront create-invalidation \
      #       --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
      #       --paths "/*"
