name: Deploy static site to S3 + CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_BUCKET: ${{ vars.AWS_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Plain HTML/CSS/JS site — no build step. Copy only the publishable
      # files into a staging dir so repo metadata never reaches the bucket.
      - name: Prepare site files
        run: |
          mkdir -p site
          rsync -a ./ site/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'site' \
            --exclude 'README.md' \
            --exclude '.gitkeep' \
            --exclude '.gitignore'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      # Static assets (images, css, js) — cache for a day at the edge/browser.
      - name: Sync assets to S3
        run: |
          aws s3 sync site "s3://${AWS_BUCKET}" --delete \
            --exclude "*.html" --exclude "*.json" \
            --cache-control "public, max-age=86400"

      # HTML and products.json — always revalidate so content changes show up immediately.
      - name: Sync HTML and data to S3
        run: |
          aws s3 sync site "s3://${AWS_BUCKET}" --delete \
            --exclude "*" --include "*.html" --include "*.json" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*"
